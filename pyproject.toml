[project]
name = "attedra-assistant"
version = "0.0.1"
description = "Personal assistant built on Attedra 0.1.0 (first slice)"
requires-python = ">=3.12"
dependencies = [
    "attedra-ref",
    "psycopg[binary]==3.3.6",
    "anthropic>=0.40",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
assistant = "assistant.cli:main"

[tool.uv.sources]
attedra-ref = { path = "vendor/attedra", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
